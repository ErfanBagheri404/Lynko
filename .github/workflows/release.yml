name: Release

# Every push to main → rolling "continuous" prerelease.
# Every tag v* → stable release. Manual dispatch → same as main.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────────────────────────
  # One version for every platform. A tag v* is authoritative (0.1.2 →
  # versionName 0.1.2); a main push gets a date-based continuous build
  # (0.1.20261002) whose versionCode is the date — monotonic, and
  # readable in the filename instead of 0.1.<run_number>.
  # ────────────────────────────────────────────────────────────────────
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      code: ${{ steps.ver.outputs.code }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"; V="${V%%-*}"
            CODE=$(echo "$V" | awk -F. '{ printf "%d%03d%03d", $1, $2, $3 }')
            PRE=false
          else
            # NSIS/MSI cap the patch segment at 65535, so a full date
            # (20261027) is illegal. Day-of-year (yy + DDD = 26301) stays
            # ≤ 99365 and is monotonic across years.
            V="0.1.$(date -u +%y%j)"
            CODE=$(date -u +%Y%m%d)
            PRE=true
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Lynko $V (code $CODE)"

  # ────────────────────────────────────────────────────────────────────
  # Android — universal, arm64-v8a, armeabi-v7a, x86_64
  # Release-signed when ANDROID_KEYSTORE_BASE64 secret exists,
  # otherwise debug-signed (still sideloadable).
  # ────────────────────────────────────────────────────────────────────
  android:
    name: Android
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build release APKs
        working-directory: android
        env:
          FLAVOR: base
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > app/release.keystore
            export KEYSTORE_FILE="$PWD/app/release.keystore"
            echo "signing with injected release keystore"
          else
            echo "no keystore secret — falling back to debug signing"
          fi
          ./gradlew "assemble${FLAVOR^}Release" \
            -PandroidVersionCode=${{ needs.version.outputs.code }} \
            -PandroidVersionName=${{ needs.version.outputs.version }}

      - name: Stage APKs
        working-directory: android
        run: |
          FLAVOR="base"
          VER="${{ needs.version.outputs.version }}"
          DEST="dist-android-$FLAVOR"
          mkdir -p "$DEST"
          find app/build/outputs/apk -name "*-release.apk" | while read -r apk; do
            NAME=$(basename "$apk")
            case "$NAME" in
              app-$FLAVOR-*-release.apk)
                ABI="${NAME#app-$FLAVOR-}"; ABI="${ABI%-release.apk}"
                cp "$apk" "$DEST/lynko-$VER-android-$ABI.apk"
                ;;
            esac
          done
          ls -la "$DEST"
          [ -n "$(ls -A "$DEST")" ] || { echo "NO APKS PRODUCED"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/dist-android-base/*.apk
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────
  # Windows — NSIS installer + MSI + portable zip
  # ────────────────────────────────────────────────────────────────────
  windows:
    name: Windows — installer + portable
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - run: npm ci
        working-directory: desktop

      - name: Stamp version
        shell: bash
        run: |
          V="${{ needs.version.outputs.version }}"
          node -e "
            const fs=require('fs');
            const p='desktop/src-tauri/tauri.conf.json';
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            j.version=process.argv[1];
            fs.writeFileSync(p,JSON.stringify(j,null,2));
          " "$V"
          sed -i "s/^version = \".*\"/version = \"$V\"/" desktop/src-tauri/Cargo.toml

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          args: --bundles nsis,msi

      - name: Assemble portable zip
        shell: bash
        run: |
          V="${{ needs.version.outputs.version }}"
          EXE="desktop/src-tauri/target/release/lynko.exe"
          [ -f "$EXE" ] || EXE=$(find desktop/src-tauri/target -name "lynko.exe" -path "*release*" | head -1)
          STAGING="Lynko-$V-windows-x64-portable"
          mkdir -p "$STAGING"
          cp "$EXE" "$STAGING/Lynko.exe"
          printf '%s\n' \
            "Lynko portable build." \
            "If the app fails to start, install the Microsoft WebView2 Runtime:" \
            "https://developer.microsoft.com/microsoft-edge/webview2/" > "$STAGING/README.txt"
          7z a "$STAGING.zip" "$STAGING"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            Lynko-*-windows-x64-portable.zip
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────
  # Linux — deb + rpm + AppImage
  # ────────────────────────────────────────────────────────────────────
  linux:
    name: Linux — deb/rpm/AppImage
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system deps
        run: |
          for i in 1 2 3; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i) — retrying in 15s"
            sleep 15
          done
          for i in 1 2 3; do
            sudo apt-get install -y \
              libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
              librsvg2-dev patchelf && break
            echo "apt-get install failed (attempt $i) — retrying in 15s"
            sleep 15
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - run: npm ci
        working-directory: desktop

      - name: Stamp version
        run: |
          V="${{ needs.version.outputs.version }}"
          node -e "
            const fs=require('fs');
            const p='desktop/src-tauri/tauri.conf.json';
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            j.version=process.argv[1];
            fs.writeFileSync(p,JSON.stringify(j,null,2));
          " "$V"
          sed -i "s/^version = \".*\"/version = \"$V\"/" desktop/src-tauri/Cargo.toml

      - name: Build bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          args: --bundles deb,rpm,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────
  # macOS — DMG (universal: aarch64 + x86_64)
  # Note: unsigned. Users right-click → Open on first launch.
  # ────────────────────────────────────────────────────────────────────
  macos:
    name: macOS — dmg (universal)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - run: npm ci
        working-directory: desktop

      - name: Stamp version
        run: |
          V="${{ needs.version.outputs.version }}"
          node -e "
            const fs=require('fs');
            const p='desktop/src-tauri/tauri.conf.json';
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            j.version=process.argv[1];
            fs.writeFileSync(p,JSON.stringify(j,null,2));
          " "$V"
          sed -i '' "s/^version = \".*\"/version = \"$V\"/" desktop/src-tauri/Cargo.toml

      - name: Build universal DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        with:
          projectPath: desktop
          tauriScript: npx tauri
          args: --target universal-apple-darwin --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────
  # Publish — collect everything into one GitHub Release
  # main → rolling "continuous" prerelease (replaced each push)
  # tag  → stable release "Lynko vX.Y.Z"
  # ────────────────────────────────────────────────────────────────────
  publish:
    name: Publish release
    needs: [version, android, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten artifacts
        run: |
          mkdir -p flat
          find release-assets -type f \( -name "*.apk" -o -name "*.exe" -o -name "*.msi" \
              -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \
              -o -name "*.dmg" \) \
            -exec cp {} flat/ \;
          ls -la flat

      - name: Publish continuous prerelease (main pushes)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete continuous --yes --cleanup-tag 2>/dev/null || true
          git config user.name "CI Bot"
          git config user.email "ci@lynko.app"
          # GitHub's merge-commit subject is an auto-generated
          # "Merge pull request #N from …" — useless as a release title.
          # For merges, the PR title lives in the first line of the body.
          SUBJ=$(git log -1 --format='%s' "$GITHUB_SHA")
          case "$SUBJ" in
            "Merge pull request #"*)
              SUBJECT=$(git log -1 --format='%b' "$GITHUB_SHA" | head -n1)
              [ -n "$SUBJECT" ] || SUBJECT="main@$(git rev-parse --short=7 "$GITHUB_SHA")"
              ;;
            *) SUBJECT="$SUBJ" ;;
          esac
          BODY=$(git log -1 --format='%B' "$GITHUB_SHA")
          git tag -f -a continuous -m "$SUBJECT" "$GITHUB_SHA"
          git push origin -f continuous
          # Per-commit tag so every commit keeps its own build marker.
          # Named build-* (never v*) so it can't re-trigger this workflow.
          PER=$(printf 'build-%s-%s' "$(date -u +%Y%m%d)" "$(git rev-parse --short=7 "$GITHUB_SHA")")
          git tag -a "$PER" -m "$BODY" "$GITHUB_SHA" 2>/dev/null || true
          git push origin "$PER" 2>/dev/null || true
          gh release create continuous \
            --prerelease \
            --title "Lynko ${{ needs.version.outputs.version }} — $SUBJECT" \
            --notes "$BODY

          Continuous build from main @ $GITHUB_SHA.
          APKs are debug-signed until a release keystore is configured." \
            flat/*

      - name: Publish stable release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Lynko ${{ github.ref_name }}" \
            --generate-notes \
            flat/*
