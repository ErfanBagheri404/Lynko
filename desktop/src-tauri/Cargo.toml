[package]
name = "lynko"
version = "0.1.0"
description = "Lynko desktop companion - your phone, on your desktop"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lynko-core = { path = "../../core" }
mdns-sd = "0.21.2"
tokio = "1.53.1"
tungstenite = "0.29.0"
reqwest = "0.13.3"
uuid = "1.20.0"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-notification = "2.4.0"
tauri-plugin-dialog = "2.7.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
