<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lynko</title>
    <script>
      // Set the theme before CSS loads so a saved light preference never flashes dark.
      try {
        var t = JSON.parse(localStorage.getItem("lynko-desktop-features") || "{}").theme;
        if (t === "system" || (t !== "light" && t !== "dark")) {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
