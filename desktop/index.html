<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lynko</title>
    <script>
      // "system" resolves the OS palette before CSS paints; explicit choices pass through.
      try {
        var t = JSON.parse(localStorage.getItem("lynko-desktop-features") || "{}").theme;
        document.documentElement.dataset.theme =
          t === "light" || t === "dark" ? t :
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
